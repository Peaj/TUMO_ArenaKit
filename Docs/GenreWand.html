<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Genre-Wand</title>
<link rel="stylesheet" href="arena.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  body { background: #fbfaf7; }

  /* Positions are stored as fractions of the board and sizes are in vw,
     so the wall looks the same on a laptop and on the projector. */
  .board {
    position: fixed; inset: 0;
    background-image: radial-gradient(#d9d6e0 1.2px, transparent 1.2px);
    background-size: 26px 26px;
    touch-action: none;
    user-select: none;
  }

  .item {
    position: absolute;
    transform: translate(-50%, -50%) rotate(var(--tilt, 0deg));
    cursor: grab;
    border: 3px solid var(--ink);
    box-shadow: 0 4px 0 var(--ink);
    max-width: 18vw;
    text-align: center;
    overflow-wrap: anywhere;
    transition: box-shadow 0.1s;
  }
  .item.dragging { cursor: grabbing; box-shadow: 0 10px 18px rgba(0,0,0,0.25), 0 4px 0 var(--ink); transform: translate(-50%, -50%) rotate(0deg) scale(1.06); }
  .item.selected { outline: 4px dashed var(--blue); outline-offset: 5px; }
  .item[contenteditable="true"] { cursor: text; outline: 4px solid var(--blue); outline-offset: 5px; user-select: text; }

  .game {
    font-family: var(--body); font-weight: 800;
    font-size: clamp(14px, 1.45vw, 40px);
    line-height: 1.15;
    padding: 0.7vw 0.9vw;
    min-width: 7vw;
    border-radius: 6px;
    background: var(--note, #fff1a8);
  }
  .genre {
    font-family: var(--heading); font-weight: 700;
    font-size: clamp(18px, 2.3vw, 64px);
    line-height: 1.1;
    padding: 0.5vw 1.4vw 0.6vw;
    border-radius: 999px;
    color: #fff;
    background: var(--genre, var(--purple));
    max-width: 26vw;
  }

  .toolbar {
    position: fixed; left: 50%; top: 12px; transform: translateX(-50%);
    z-index: 20;
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px;
    padding: 8px 10px;
    background: var(--ink); color: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 0 #000;
    max-width: calc(100vw - 24px);
  }
  .toolbar input { width: 220px; padding: 5px 10px; border-width: 2px; }
  .toolbar .group { display: flex; gap: 6px; align-items: center; }
  .toolbar .sep { width: 2px; align-self: stretch; background: #5d5a69; }
  .toolbar .btn { box-shadow: 0 3px 0 #000; }
  .swatch { width: 26px; height: 26px; border-radius: 6px; border: 2.5px solid #fff; cursor: pointer; padding: 0; }
  .swatch[aria-pressed="true"] { border-color: var(--yellow); box-shadow: 0 0 0 2px var(--yellow); }
  .toolbar.hidden { display: none; }
  .show-tools { position: fixed; top: 12px; right: 12px; z-index: 20; }

  .trash {
    position: fixed; right: 18px; bottom: 18px; z-index: 15;
    width: 96px; height: 96px; border-radius: 50%;
    display: grid; place-items: center; font-size: 2.6rem;
    border: 3px dashed var(--ink-soft); background: rgba(255,255,255,0.9);
    opacity: 0; transition: opacity 0.15s, transform 0.15s; pointer-events: none;
  }
  body.is-dragging .trash { opacity: 1; }
  .trash.hot { transform: scale(1.2); border-color: var(--red); background: var(--red-soft); }

  .empty-hint { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; text-align: center; color: #b4b0bf; font-family: var(--heading); font-size: clamp(20px, 2.6vw, 48px); }
</style>
</head>
<body>
<div class="board" id="board"></div>
<div class="empty-hint" id="emptyHint"><div>Lieblingsspiele eintragen und nach Genres sortieren!<br><small style="font-size:0.55em">Ziehen zum Verschieben · Doppelklick zum Ändern · Auf den Mülleimer ziehen oder Entf zum Löschen · T blendet die Leiste aus</small></div></div>

<div class="toolbar" id="toolbar">
  <div class="group">
    <input type="text" id="gameInput" placeholder="🎮 Spiel eintragen ..." aria-label="Spiel eintragen">
    <button class="btn small primary" id="addGame">+ Spiel</button>
  </div>
  <div class="group" id="colors" aria-label="Zettelfarbe"></div>
  <span class="sep"></span>
  <div class="group">
    <input type="text" id="genreInput" placeholder="🏷️ Genre ..." aria-label="Genre eintragen" style="width:170px">
    <button class="btn small" id="addGenre">+ Genre</button>
    <button class="btn small" id="sampleGenres" title="Typische Genres auf die Wand legen">Beispiel-Genres</button>
  </div>
  <span class="sep"></span>
  <div class="group">
    <button class="btn small" id="undo" title="Rückgängig (Cmd/Strg+Z)">↶</button>
    <button class="btn small" id="clear">Leeren</button>
    <button class="btn small" id="full" title="Vollbild">⛶</button>
    <button class="btn small" id="hideTools" title="Leiste ausblenden (T)">▲</button>
  </div>
</div>
<button class="btn small show-tools" id="showTools" hidden>▼ Leiste</button>
<div class="trash" id="trash" aria-hidden="true">🗑️</div>

<script src="arena.js"></script>
<script>
(function () {
  const NOTE_COLORS = ["#fff1a8", "#ffd1dc", "#cfe6ff", "#d3f5d9", "#ffe0b8", "#e6dcff"];
  const GENRE_COLORS = ["#8e6bd8", "#e8503f", "#4a90e2", "#2c9a50", "#e08a1e", "#d94f9b", "#3a9fa8", "#5d5a69"];
  const SAMPLE_GENRES = ["Plattformer", "Shooter", "Rennspiel", "Sport", "Puzzle", "Strategie", "Rollenspiel", "Simulation", "Sandbox", "Kampfspiel", "Party", "Horror"];

  const board = document.getElementById("board");
  const trash = document.getElementById("trash");
  let items = Arena.store.get("genrewand.items", []);
  let noteColor = 0;
  let selected = null;
  let history = [];

  const uid = () => Math.random().toString(36).slice(2, 10);
  const tilt = () => (Math.random() * 6 - 3).toFixed(1) + "deg";

  function remember() {
    history.push(JSON.stringify(items));
    if (history.length > 60) history.shift();
  }

  function save() {
    Arena.store.set("genrewand.items", items);
    document.getElementById("emptyHint").hidden = items.length > 0;
  }

  function render() {
    board.innerHTML = "";
    items.forEach((item) => board.appendChild(makeElement(item)));
    save();
  }

  function makeElement(item) {
    const element = document.createElement("div");
    element.className = "item " + item.type;
    element.dataset.id = item.id;
    element.textContent = item.text;
    element.style.left = item.x * 100 + "%";
    element.style.top = item.y * 100 + "%";
    element.style.setProperty("--tilt", item.type === "game" ? item.tilt : "0deg");
    if (item.type === "game") element.style.setProperty("--note", item.color);
    else element.style.setProperty("--genre", item.color);
    if (item.id === selected) element.classList.add("selected");
    element.addEventListener("pointerdown", (event) => startDrag(event, item, element));
    element.addEventListener("dblclick", () => edit(item, element));
    return element;
  }

  // ---- Adding ----
  function freeSpot(type) {
    // New games line up along the bottom, new genres along the top: then drag them where they belong.
    const count = items.filter((i) => i.type === type).length;
    if (type === "game") return { x: 0.07 + (count % 11) * 0.085, y: 0.9 - Math.floor(count / 11) % 3 * 0.075 };
    return { x: 0.1 + (count % 6) * 0.16, y: 0.2 + Math.floor(count / 6) % 3 * 0.22 };
  }

  function add(type, text) {
    text = text.trim();
    if (!text) return;
    remember();
    const spot = freeSpot(type);
    const genres = items.filter((i) => i.type === "genre").length;
    items.push({
      id: uid(), type, text, x: spot.x, y: spot.y,
      color: type === "game" ? NOTE_COLORS[noteColor] : GENRE_COLORS[genres % GENRE_COLORS.length],
      tilt: tilt(),
    });
    render();
  }

  const gameInput = document.getElementById("gameInput");
  const genreInput = document.getElementById("genreInput");
  const addGame = () => { add("game", gameInput.value); gameInput.value = ""; gameInput.focus(); };
  const addGenre = () => { add("genre", genreInput.value); genreInput.value = ""; genreInput.focus(); };
  document.getElementById("addGame").onclick = addGame;
  document.getElementById("addGenre").onclick = addGenre;
  gameInput.addEventListener("keydown", (e) => { if (e.key === "Enter") addGame(); });
  genreInput.addEventListener("keydown", (e) => { if (e.key === "Enter") addGenre(); });
  document.getElementById("sampleGenres").onclick = () => {
    const existing = new Set(items.filter((i) => i.type === "genre").map((i) => i.text.toLowerCase()));
    SAMPLE_GENRES.filter((g) => !existing.has(g.toLowerCase())).forEach((g) => add("genre", g));
  };

  const colors = document.getElementById("colors");
  NOTE_COLORS.forEach((color, n) => {
    const swatch = document.createElement("button");
    swatch.className = "swatch";
    swatch.style.background = color;
    swatch.title = "Zettelfarbe";
    swatch.setAttribute("aria-pressed", n === noteColor);
    swatch.onclick = () => {
      noteColor = n;
      colors.querySelectorAll(".swatch").forEach((s, i) => s.setAttribute("aria-pressed", i === n));
      // Recolor the selected note, like picking a different post-it.
      const item = items.find((i) => i.id === selected && i.type === "game");
      if (item) { remember(); item.color = color; render(); }
    };
    colors.appendChild(swatch);
  });

  // ---- Dragging ----
  function startDrag(event, item, element) {
    if (element.isContentEditable || event.button > 0) return;
    event.preventDefault();
    const rect = board.getBoundingClientRect();
    const startX = event.clientX, startY = event.clientY;
    const originX = item.x, originY = item.y;
    let moved = false;
    select(item.id);
    try { element.setPointerCapture(event.pointerId); } catch (e) { /* not available for this pointer */ }

    const move = (e) => {
      const dx = e.clientX - startX, dy = e.clientY - startY;
      if (!moved && Math.hypot(dx, dy) < 4) return;
      if (!moved) {
        moved = true;
        remember();
        element.style.zIndex = 10; // lift it above the others while dragging
        element.classList.add("dragging");
        document.body.classList.add("is-dragging");
      }
      item.x = Math.min(0.99, Math.max(0.01, originX + dx / rect.width));
      item.y = Math.min(0.99, Math.max(0.01, originY + dy / rect.height));
      element.style.left = item.x * 100 + "%";
      element.style.top = item.y * 100 + "%";
      trash.classList.toggle("hot", overTrash(e));
    };
    const up = (e) => {
      window.removeEventListener("pointermove", move);
      window.removeEventListener("pointerup", up);
      window.removeEventListener("pointercancel", up);
      element.classList.remove("dragging");
      document.body.classList.remove("is-dragging");
      // A plain click only selects. Redrawing now would swallow the double-click for editing.
      if (!moved) return;
      if (overTrash(e)) {
        items = items.filter((i) => i !== item);
        trash.classList.remove("hot");
      } else {
        // Keep the drawing order: what was moved last lies on top.
        items = items.filter((i) => i !== item).concat(item);
      }
      render();
    };
    window.addEventListener("pointermove", move);
    window.addEventListener("pointerup", up);
    window.addEventListener("pointercancel", up);
  }

  function overTrash(event) {
    const r = trash.getBoundingClientRect();
    return event.clientX >= r.left - 20 && event.clientX <= r.right + 20 && event.clientY >= r.top - 20 && event.clientY <= r.bottom + 20;
  }

  function select(id) {
    selected = id;
    board.querySelectorAll(".item").forEach((el) => el.classList.toggle("selected", el.dataset.id === id));
  }
  board.addEventListener("pointerdown", (e) => { if (e.target === board) select(null); });

  // ---- Editing ----
  function edit(item, element) {
    element.contentEditable = "true";
    element.focus();
    document.getSelection().selectAllChildren(element);
    const finish = (keep) => {
      element.removeEventListener("blur", onBlur);
      element.removeEventListener("keydown", onKey);
      const text = element.textContent.trim();
      if (keep && text !== item.text) {
        remember();
        if (text) item.text = text; else items = items.filter((i) => i !== item);
      }
      render();
    };
    const onBlur = () => finish(true);
    const onKey = (e) => {
      if (e.key === "Enter") { e.preventDefault(); finish(true); }
      if (e.key === "Escape") { e.preventDefault(); finish(false); }
    };
    element.addEventListener("blur", onBlur);
    element.addEventListener("keydown", onKey);
  }

  // ---- Keys and buttons ----
  function undo() {
    if (!history.length) return;
    items = JSON.parse(history.pop());
    render();
  }
  document.addEventListener("keydown", (e) => {
    const typing = e.target.matches("input, textarea") || e.target.isContentEditable;
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "z" && !typing) { e.preventDefault(); undo(); }
    if (typing) return;
    if ((e.key === "Delete" || e.key === "Backspace") && selected) {
      remember();
      items = items.filter((i) => i.id !== selected);
      selected = null;
      render();
    }
    if (e.key.toLowerCase() === "t") toggleTools();
  });
  document.getElementById("undo").onclick = undo;
  document.getElementById("clear").onclick = () => {
    if (!items.length || !confirm("Die ganze Wand leeren? (Mit ↶ lässt sich das rückgängig machen.)")) return;
    remember();
    items = [];
    render();
  };
  document.getElementById("full").onclick = () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
  };
  function toggleTools() {
    const bar = document.getElementById("toolbar");
    bar.classList.toggle("hidden");
    document.getElementById("showTools").hidden = !bar.classList.contains("hidden");
  }
  document.getElementById("hideTools").onclick = toggleTools;
  document.getElementById("showTools").onclick = toggleTools;

  render();
  gameInput.focus();
})();
</script>
</body>
</html>
