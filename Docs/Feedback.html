<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feedback-Box</title>
<link rel="stylesheet" href="arena.css">
<style>
  .layout { display: grid; grid-template-columns: minmax(300px, 440px) 1fr; gap: 24px; align-items: start; }
  @media (max-width: 820px) { .layout { grid-template-columns: 1fr; } }
  .owner { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 6px 0 20px; }
  .owner input { max-width: 260px; font-family: var(--heading); font-weight: 600; font-size: 1.2rem; }

  .form { background: var(--yellow-soft); }
  .stars { display: flex; gap: 4px; }
  .stars button { font-size: 1.9rem; line-height: 1; background: none; border: none; cursor: pointer; padding: 0 2px; color: #c9c6d1; }
  .stars button.on { color: var(--yellow); text-shadow: 0 0 0 var(--ink), 1px 1px 0 var(--ink), -1px 1px 0 var(--ink), 1px -1px 0 var(--ink), -1px -1px 0 var(--ink); }
  .rating-row { display: grid; grid-template-columns: 120px 1fr; align-items: center; margin: 6px 0; font-weight: 800; }

  .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .summary .card { text-align: center; padding: 10px; }
  .summary b { display: block; font-family: var(--heading); font-size: 1.6rem; }

  .entry { margin-bottom: 12px; }
  .entry header { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 6px; }
  .entry header b { font-family: var(--heading); font-size: 1.1rem; }
  .entry .mini { color: var(--yellow); font-size: 1.05rem; letter-spacing: 1px; -webkit-text-stroke: 0.6px var(--ink); }
  .entry .row { display: grid; grid-template-columns: 28px 1fr; gap: 6px; margin: 4px 0; }
  .entry .del { background: none; border: none; cursor: pointer; font-size: 1.1rem; }
  .none { color: var(--ink-soft); font-weight: 700; border: 3px dashed var(--ink-soft); border-radius: 14px; padding: 24px; text-align: center; }

  @media print {
    .layout { display: block; }
    .entry { border-width: 1.5px; }
    .entry .del { display: none; }
  }
</style>
</head>
<body>
<nav class="topbar" data-page="feedback"></nav>
<div class="page">
  <h1>📝 Feedback-Box</h1>
  <div class="owner">
    <span class="lead" style="margin:0">Dieses Level ist von</span>
    <input type="text" id="owner" placeholder="Name" aria-label="Wer hat das Level gebaut?">
  </div>

  <div class="layout">
    <form class="card form no-print" id="form">
      <h2 style="font-size:1.4rem">Du hast getestet? Sag es!</h2>
      <label class="field" for="tester">Dein Name</label>
      <input type="text" id="tester" required>
      <div style="margin-top:10px">
        <div class="rating-row"><span>Spaß</span><div class="stars" data-rating="fun"></div></div>
        <div class="rating-row"><span>Fair</span><div class="stars" data-rating="fair"></div></div>
        <div class="rating-row"><span>Sieht gut aus</span><div class="stars" data-rating="look"></div></div>
      </div>
      <label class="field" for="good">😀 Das war super</label>
      <textarea id="good"></textarea>
      <label class="field" for="bad">😕 Das war unfair oder verwirrend</label>
      <textarea id="bad"></textarea>
      <label class="field" for="idea">💡 Meine Idee für dich</label>
      <textarea id="idea"></textarea>
      <div class="btn-row" style="margin-top:14px"><button class="btn primary" type="submit">📮 Abschicken</button></div>
    </form>

    <div>
      <div class="summary" id="summary"></div>
      <div id="entries"></div>
      <div class="btn-row no-print" style="margin-top:10px"><button class="btn small" onclick="window.print()">🖨️ Feedback drucken</button></div>
    </div>
  </div>
</div>

<script src="arena.js"></script>
<script>
const RATINGS = { fun: "Spaß", fair: "Fair", look: "Sieht gut aus" };
let entries = Arena.store.get("feedback.entries", []);
let ratings = { fun: 0, fair: 0, look: 0 };

const owner = document.getElementById("owner");
owner.value = Arena.store.get("feedback.owner", "");
owner.addEventListener("input", () => Arena.store.set("feedback.owner", owner.value));

document.querySelectorAll(".stars").forEach((box) => {
  const key = box.dataset.rating;
  for (let i = 1; i <= 5; i++) {
    const star = document.createElement("button");
    star.type = "button";
    star.textContent = "★";
    star.setAttribute("aria-label", `${RATINGS[key]}: ${i} von 5`);
    star.onclick = () => { ratings[key] = i; paintStars(); };
    box.appendChild(star);
  }
});

function paintStars() {
  document.querySelectorAll(".stars").forEach((box) => {
    box.querySelectorAll("button").forEach((star, i) => star.classList.toggle("on", i < ratings[box.dataset.rating]));
  });
}

function stars(n) {
  return "★".repeat(n) + "☆".repeat(5 - n);
}

function render() {
  const list = document.getElementById("entries");
  const summary = document.getElementById("summary");
  if (entries.length === 0) {
    list.innerHTML = `<div class="none">Noch kein Feedback. Beim Playtest füllen die Tester hier ihre Karte aus.</div>`;
    summary.innerHTML = "";
    return;
  }
  summary.innerHTML = Object.keys(RATINGS).map((key) => {
    const rated = entries.filter((e) => e[key] > 0);
    const average = rated.length ? rated.reduce((sum, e) => sum + e[key], 0) / rated.length : 0;
    return `<div class="card"><span class="muted">${RATINGS[key]}</span><b>${average ? average.toFixed(1) : "–"} ★</b></div>`;
  }).join("") + `<div class="card"><span class="muted">Karten</span><b>${entries.length}</b></div>`;

  const esc = Arena.escapeHtml;
  list.innerHTML = entries.slice().reverse().map((e, index) => `
    <div class="card entry">
      <header><b>${esc(e.tester || "Jemand")}</b>
        <span><span class="mini" title="Spaß / Fair / Aussehen">${stars(e.fun)} ${stars(e.fair)} ${stars(e.look)}</span>
        <button class="del" data-index="${entries.length - 1 - index}" title="Löschen" aria-label="Löschen">🗑️</button></span></header>
      ${e.good ? `<div class="row"><span>😀</span><span>${esc(e.good)}</span></div>` : ""}
      ${e.bad ? `<div class="row"><span>😕</span><span>${esc(e.bad)}</span></div>` : ""}
      ${e.idea ? `<div class="row"><span>💡</span><span>${esc(e.idea)}</span></div>` : ""}
    </div>`).join("");
  list.querySelectorAll(".del").forEach((button) => {
    button.onclick = () => {
      if (!confirm("Diese Feedback-Karte löschen?")) return;
      entries.splice(Number(button.dataset.index), 1);
      Arena.store.set("feedback.entries", entries);
      render();
    };
  });
}

document.getElementById("form").addEventListener("submit", (event) => {
  event.preventDefault();
  const value = (id) => document.getElementById(id).value.trim();
  entries.push({ tester: value("tester"), good: value("good"), bad: value("bad"), idea: value("idea"), ...ratings, at: Date.now() });
  if (!Arena.store.set("feedback.entries", entries)) Arena.toast("Achtung: Speichern geht in diesem Browser nicht!");
  else Arena.toast("Danke für dein Feedback! 📮");
  event.target.reset();
  ratings = { fun: 0, fair: 0, look: 0 };
  paintStars();
  render();
});

paintStars();
render();
</script>
</body>
</html>
